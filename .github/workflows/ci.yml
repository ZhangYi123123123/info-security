name: Lab1 Secure API CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit safety

      # SAST Bandit 静态代码扫描：先打印漏洞到控制台方便截图，再输出json文件；检出漏洞不终止流水线
      - name: SAST Bandit scan
        run: |
          bandit -r .
          bandit -r . -f json -o bandit-report.json || true

      # SCA Safety 依赖漏洞扫描：先打印漏洞到控制台方便截图，再输出json文件；检出漏洞不终止流水线
      - name: SCA Safety check
        run: |
          safety check
          safety check --json > safety-report.json || true