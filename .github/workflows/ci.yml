name: Lab1 Secure API CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit safety
          # 修复 SCA 检出的 setuptools 漏洞 (SFTY-20260721-58460 / CVE-2026-59898, affected <83.0.0)
          # 放在最后升级，确保扫描前环境里的 setuptools 已是安全版本
          pip install --upgrade "setuptools>=83.0.0"

      # SAST Bandit 静态代码扫描：先打印漏洞，再输出json，两条命令都加||true防止失败
      - name: SAST Bandit scan
        run: |
          bandit -r . || true
          bandit -r . -f json -o bandit-report.json || true

      # SCA Safety 依赖漏洞扫描：先打印漏洞，再输出json，防止检出漏洞导致job失败
      # PYTHONWARNINGS=ignore 关闭 safety 自身依赖 authlib 的 DeprecationWarning
      # grep -v 过滤 safety 对 check 命令的 DEPRECATED 提示（仅提示，不影响扫描结果）
      - name: SCA Safety check
        env:
          PYTHONWARNINGS: ignore
        run: |
          safety check 2>&1 | grep -v -E "DEPRECATED|We highly encourage" || true
          safety check --json > safety-report.json 2>/dev/null || true